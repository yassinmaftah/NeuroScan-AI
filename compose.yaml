services:
  notebook-tf:
    build:
      context: .
      args:
        REQ: requirements-tf.txt
    image: neuroscan-tf
    ports:
      - "8888:8888"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./src:/app/src
      - ./reports:/app/reports
      - ./notebooks:/app/notebooks
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --IdentityProvider.token=neuroscan --ServerApp.disable_check_xsrf=True
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
  notebook-yolo:
    build:
      context: .
      args:
        REQ: requirements-yolo.txt
    image: neuroscan-yolo
    ports:
      - "8889:8888"
    shm_size: "4gb"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./src:/app/src
      - ./reports:/app/reports
      - ./notebooks:/app/notebooks
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --IdentityProvider.token=neuroscan --ServerApp.disable_check_xsrf=True
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    image: neuroscan-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db --artifacts-destination /mlflow/artifacts --serve-artifacts
  