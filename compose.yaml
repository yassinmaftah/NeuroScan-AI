services:
  notebook-tf:
    build:
      context: .
      args:
        REQ: requirements-tf.txt
    image: neuroscan-tf
    ports:
      - "8888:8888"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./src:/app/src
      - ./reports:/app/reports
      - ./notebooks:/app/notebooks
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --IdentityProvider.token=neuroscan --ServerApp.disable_check_xsrf=True
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
  notebook-yolo:
    build:
      context: .
      args:
        REQ: requirements-yolo.txt
    image: neuroscan-yolo
    ports:
      - "8889:8888"
    shm_size: "4gb"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./src:/app/src
      - ./reports:/app/reports
      - ./notebooks:/app/notebooks
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --IdentityProvider.token=neuroscan --ServerApp.disable_check_xsrf=True
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    image: neuroscan-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db --artifacts-destination /mlflow/artifacts --serve-artifacts

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: neuroscan-airflow
    user: "0:0"
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      HOST_PROJECT_DIR: ${HOST_PROJECT_DIR}
    volumes:
      - airflow_home:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
    command: standalone
    depends_on:
      - mlflow

volumes:
  airflow_home: